name: BrowserCMD CI

on:
  push:
    paths:
      - "BrowserCMD/**"
      - ".github/workflows/browsercmd-ci.yml"
  pull_request:
    paths:
      - "BrowserCMD/**"
      - ".github/workflows/browsercmd-ci.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: BrowserCMD
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python native/build.py
      - run: python bin/renderer --selftest
        if: runner.os == 'Linux'
      - run: .\bin\renderer.exe --selftest
        if: runner.os == 'Windows'
      - run: python -m pytest