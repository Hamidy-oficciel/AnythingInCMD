[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "browsercmd"
version = "0.1.0a0"
description = "A Windows-first browser rendered in a terminal"
requires-python = ">=3.10"
dependencies = ["websockets>=13,<16"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
browsercmd = "browsercmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]